name: quality-gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser runtime
        run: |
          npm ci --prefix tests/browser --no-audit --no-fund
          cd tests/browser
          npx playwright install --with-deps chromium
      - name: Run the same checks as local agents
        if: always()
        shell: pwsh
        run: ./eng/verify.ps1
      - name: Publish verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-report
          path: artifacts/
          if-no-files-found: error
      - name: Print report to job summary
        if: always()
        run: |
          if [ -f artifacts/verification.json ]; then
            echo '## Harness verification' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat artifacts/verification.json >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi
